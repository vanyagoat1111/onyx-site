<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="52%" stop-color="#0E0C0A"/>
      <stop offset="78%" stop-color="#171210"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <radialGradient id="goldHaze" cx="50%" cy="74%" r="58%">
      <stop offset="0%" stop-color="#C9A263" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#8A6A3B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="towerFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#332B21"/>
      <stop offset="100%" stop-color="#221D16"/>
    </linearGradient>
    <linearGradient id="towerMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#463A2B"/>
      <stop offset="60%" stop-color="#2E261D"/>
      <stop offset="100%" stop-color="#191512"/>
    </linearGradient>
    <linearGradient id="towerNear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A231C"/>
      <stop offset="70%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#100D0B"/>
    </linearGradient>
    <linearGradient id="vgnR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080808" stop-opacity="0.88"/>
      <stop offset="30%" stop-color="#080808" stop-opacity="0.34"/>
      <stop offset="58%" stop-color="#080808" stop-opacity="0.04"/>
      <stop offset="88%" stop-color="#080808" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="sideFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#080808" stop-opacity="0.62"/>
      <stop offset="22%" stop-color="#080808" stop-opacity="0.05"/>
      <stop offset="78%" stop-color="#080808" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0.62"/>
    </linearGradient>
    <!-- Сетка светящихся окон -->
    <pattern id="winFar" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect width="14" height="18" fill="none"/>
      <rect x="3" y="4" width="6" height="8" fill="#D9B67C" opacity="0.62"/>
    </pattern>
    <pattern id="winMid" width="20" height="26" patternUnits="userSpaceOnUse">
      <rect width="20" height="26" fill="none"/>
      <rect x="4" y="6" width="9" height="12" fill="#F0D6A4" opacity="0.72"/>
    </pattern>
    <pattern id="winNear" width="28" height="34" patternUnits="userSpaceOnUse">
      <rect width="28" height="34" fill="none"/>
      <rect x="6" y="8" width="13" height="16" fill="#F7E7C2" opacity="0.52"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#dusk)"/>
  <rect width="1600" height="900" fill="url(#goldHaze)"/>

  <!-- ДАЛЬНИЙ ПЛАН -->
  <g opacity="0.75">
    <g>
      <rect x="60" y="470" width="86" height="300" fill="url(#towerFar)"/><rect x="60" y="470" width="86" height="300" fill="url(#winFar)"/>
      <rect x="166" y="524" width="70" height="246" fill="url(#towerFar)"/><rect x="166" y="524" width="70" height="246" fill="url(#winFar)"/>
      <rect x="256" y="440" width="94" height="330" fill="url(#towerFar)"/><rect x="256" y="440" width="94" height="330" fill="url(#winFar)"/>
      <rect x="370" y="500" width="76" height="270" fill="url(#towerFar)"/><rect x="370" y="500" width="76" height="270" fill="url(#winFar)"/>
      <rect x="1180" y="486" width="88" height="284" fill="url(#towerFar)"/><rect x="1180" y="486" width="88" height="284" fill="url(#winFar)"/>
      <rect x="1288" y="450" width="78" height="320" fill="url(#towerFar)"/><rect x="1288" y="450" width="78" height="320" fill="url(#winFar)"/>
      <rect x="1386" y="510" width="92" height="260" fill="url(#towerFar)"/><rect x="1386" y="510" width="92" height="260" fill="url(#winFar)"/>
      <rect x="1498" y="470" width="80" height="300" fill="url(#towerFar)"/><rect x="1498" y="470" width="80" height="300" fill="url(#winFar)"/>
    </g>
  </g>

  <!-- СРЕДНИЙ ПЛАН: доминанты -->
  <g opacity="0.9">
    <!-- левая башня -->
    <rect x="430" y="330" width="128" height="440" fill="url(#towerMid)"/>
    <rect x="430" y="330" width="128" height="440" fill="url(#winMid)"/>
    <rect x="430" y="330" width="128" height="8" fill="#C9A263" opacity="0.45"/>
    <rect x="486" y="288" width="8" height="44" fill="#1C1712"/>
    <circle cx="490" cy="284" r="3.5" fill="#C9A263" opacity="0.8"/>
    <!-- центральная высотка -->
    <rect x="700" y="252" width="150" height="518" fill="url(#towerMid)"/>
    <rect x="700" y="252" width="150" height="518" fill="url(#winMid)"/>
    <rect x="700" y="252" width="150" height="9" fill="#C9A263" opacity="0.5"/>
    <path d="M700 252 L775 208 L850 252 Z" fill="#1A1610"/>
    <rect x="771" y="168" width="8" height="44" fill="#1C1712"/>
    <circle cx="775" cy="164" r="4" fill="#C9A263" opacity="0.85"/>
    <!-- правая башня -->
    <rect x="990" y="356" width="132" height="414" fill="url(#towerMid)"/>
    <rect x="990" y="356" width="132" height="414" fill="url(#winMid)"/>
    <rect x="990" y="356" width="132" height="8" fill="#C9A263" opacity="0.42"/>
  </g>

  <!-- БЛИЖНИЙ ПЛАН: обрамляющие объёмы -->
  <g opacity="0.98">
    <rect x="0" y="418" width="180" height="352" fill="url(#towerNear)"/>
    <rect x="0" y="418" width="180" height="352" fill="url(#winNear)"/>
    <rect x="0" y="418" width="180" height="7" fill="#C9A263" opacity="0.34"/>

    <rect x="584" y="470" width="102" height="300" fill="url(#towerNear)"/>
    <rect x="584" y="470" width="102" height="300" fill="url(#winNear)"/>

    <rect x="874" y="440" width="98" height="330" fill="url(#towerNear)"/>
    <rect x="874" y="440" width="98" height="330" fill="url(#winNear)"/>

    <rect x="1420" y="396" width="180" height="374" fill="url(#towerNear)"/>
    <rect x="1420" y="396" width="180" height="374" fill="url(#winNear)"/>
    <rect x="1420" y="396" width="180" height="7" fill="#C9A263" opacity="0.34"/>
  </g>

  <!-- Линия земли и золотое зарево у основания -->
  <rect x="0" y="766" width="1600" height="6" fill="#C9A263" opacity="0.34"/>
  <rect x="0" y="772" width="1600" height="128" fill="#080808"/>
  <ellipse cx="800" cy="772" rx="720" ry="86" fill="#C9A263" opacity="0.07"/>

  <rect width="1600" height="900" fill="url(#sideFade)"/>
  <rect width="1600" height="900" fill="url(#vgnR)"/>
</svg>
