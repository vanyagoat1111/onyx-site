<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <defs>
    <linearGradient id="hall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="60%" stop-color="#141110"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <radialGradient id="hotLight" cx="70%" cy="30%" r="52%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.40"/>
      <stop offset="45%" stop-color="#F97316" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolFill" cx="18%" cy="78%" r="45%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="readF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0.95"/>
      <stop offset="36%" stop-color="#0A0A0A" stop-opacity="0.74"/>
      <stop offset="70%" stop-color="#0A0A0A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vgnF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0.80"/>
      <stop offset="38%" stop-color="#0A0A0A" stop-opacity="0"/>
      <stop offset="84%" stop-color="#0A0A0A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A4A4E"/>
      <stop offset="35%" stop-color="#2E2E32"/>
      <stop offset="100%" stop-color="#1A1A1D"/>
    </linearGradient>
    <linearGradient id="steelHot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#3A2A22"/>
      <stop offset="100%" stop-color="#1A1A1D"/>
    </linearGradient>
    <linearGradient id="floorF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1616"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#hall)"/>
  <rect width="1600" height="900" fill="url(#hotLight)"/>
  <rect width="1600" height="900" fill="url(#coolFill)"/>

  <!-- Потолочные фермы -->
  <g stroke="#2A2A2E" stroke-width="6" fill="none" opacity="0.85">
    <path d="M700 96 H1600"/>
    <path d="M700 150 H1600"/>
    <path d="M700 96 L760 150 L820 96 L880 150 L940 96 L1000 150 L1060 96 L1120 150 L1180 96 L1240 150 L1300 96 L1360 150 L1420 96 L1480 150 L1540 96 L1600 150" stroke-width="3"/>
  </g>
  <!-- Подвесные светильники -->
  <g>
    <path d="M900 150 V196" stroke="#2A2A2E" stroke-width="3"/>
    <path d="M1180 150 V214" stroke="#2A2A2E" stroke-width="3"/>
    <path d="M1460 150 V196" stroke="#2A2A2E" stroke-width="3"/>
    <ellipse cx="900" cy="204" rx="46" ry="12" fill="#F97316" opacity="0.16"/>
    <ellipse cx="1180" cy="222" rx="54" ry="14" fill="#DC2626" opacity="0.20"/>
    <ellipse cx="1460" cy="204" rx="46" ry="12" fill="#F97316" opacity="0.14"/>
    <path d="M854 204 L946 204 L1010 470 L790 470 Z" fill="#F97316" opacity="0.045"/>
    <path d="M1126 222 L1234 222 L1310 470 L1050 470 Z" fill="#DC2626" opacity="0.055"/>
  </g>

  <!-- Силовая рама (power rack) -->
  <g transform="translate(1010,0)">
    <rect x="0" y="250" width="26" height="420" fill="url(#steelHot)"/>
    <rect x="300" y="250" width="26" height="420" fill="url(#steel)"/>
    <rect x="0" y="250" width="326" height="22" fill="url(#steel)"/>
    <rect x="0" y="300" width="326" height="10" fill="#232326"/>
    <!-- гриф на упорах -->
    <rect x="-40" y="386" width="406" height="12" rx="6" fill="#3A3A3F"/>
    <rect x="-40" y="386" width="406" height="5" rx="2.5" fill="#5A5A61"/>
    <!-- блины на грифе -->
    <g>
      <rect x="-52" y="342" width="20" height="100" rx="6" fill="#1E1E22"/>
      <rect x="-52" y="342" width="6" height="100" rx="3" fill="#DC2626" opacity="0.75"/>
      <rect x="-26" y="356" width="16" height="72" rx="5" fill="#1E1E22"/>
      <rect x="336" y="342" width="20" height="100" rx="6" fill="#1E1E22"/>
      <rect x="350" y="342" width="6" height="100" rx="3" fill="#DC2626" opacity="0.75"/>
      <rect x="316" y="356" width="16" height="72" rx="5" fill="#1E1E22"/>
    </g>
    <!-- отверстия рамы -->
    <g fill="#0D0D0F">
      <circle cx="13" cy="330" r="4"/><circle cx="13" cy="360" r="4"/><circle cx="13" cy="390" r="4"/>
      <circle cx="13" cy="420" r="4"/><circle cx="13" cy="450" r="4"/><circle cx="13" cy="480" r="4"/>
      <circle cx="313" cy="330" r="4"/><circle cx="313" cy="360" r="4"/><circle cx="313" cy="390" r="4"/>
      <circle cx="313" cy="420" r="4"/><circle cx="313" cy="450" r="4"/><circle cx="313" cy="480" r="4"/>
    </g>
  </g>

  <!-- Стойка с блинами справа -->
  <g transform="translate(1440,0)">
    <rect x="0" y="520" width="150" height="14" fill="#2A2A2E"/>
    <rect x="10" y="534" width="14" height="136" fill="#232326"/>
    <rect x="126" y="534" width="14" height="136" fill="#232326"/>
    <g>
      <circle cx="42" cy="486" r="34" fill="#17171A"/><circle cx="42" cy="486" r="12" fill="#0C0C0E"/>
      <circle cx="42" cy="486" r="34" fill="none" stroke="#F97316" stroke-width="2.5" opacity="0.5"/>
      <circle cx="108" cy="486" r="34" fill="#17171A"/><circle cx="108" cy="486" r="12" fill="#0C0C0E"/>
      <circle cx="108" cy="486" r="34" fill="none" stroke="#DC2626" stroke-width="2.5" opacity="0.55"/>
    </g>
  </g>

  <!-- Гантельный ряд слева от рамы -->
  <g transform="translate(820,600)" opacity="0.9">
    <rect x="0" y="0" width="150" height="10" fill="#2A2A2E"/>
    <g fill="#1C1C20">
      <rect x="10" y="-26" width="34" height="26" rx="7"/>
      <rect x="56" y="-22" width="30" height="22" rx="6"/>
      <rect x="98" y="-18" width="26" height="18" rx="5"/>
    </g>
  </g>

  <!-- Пол и отражения -->
  <rect x="0" y="668" width="1600" height="232" fill="url(#floorF)"/>
  <rect x="0" y="666" width="1600" height="2" fill="#F97316" opacity="0.18"/>
  <g opacity="0.10">
    <rect x="1010" y="668" width="26" height="90" fill="#F97316"/>
    <rect x="1310" y="668" width="26" height="90" fill="#DC2626"/>
    <rect x="1450" y="668" width="140" height="70" fill="#F97316"/>
  </g>

  <rect width="1600" height="900" fill="url(#readF)"/>
  <rect width="1600" height="900" fill="url(#vgnF)"/>
</svg>
