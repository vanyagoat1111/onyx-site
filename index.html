    <!-- Шрифты лежат на нашем домене.

         Раньше они тянулись с fonts.googleapis.com, а он в России недоступен
         без VPN. Пока ссылка была блокирующей, браузер ждал таймаута и не
         рисовал вообще ничего: с VPN сайт открывался, без VPN человек видел
         пустой экран и уходил.

         Снять блокировку было недостаточно - без Google сайт открывался,
         но терял всю типографику, а мы продаём дизайн. Поэтому шрифты
         забраны к себе: скриптом scripts/fetch-fonts.mjs, только кириллица
         и латиница, только нужные начертания.

         Теперь у сайта НЕТ внешних зависимостей в отрисовке. Открылся домен -
         открылся сайт целиком, одинаково с VPN и без него.

         Если файлов вдруг нет (скрипт не запускали), браузер просто
         не найдёт стиль и возьмёт системный шрифт. Сайт всё равно откроется:
         худший случай тут - другой шрифт, а не пустой экран. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Сайт вы увидите раньше, чем заплатите | ONYX WEB</title>
  </head>
